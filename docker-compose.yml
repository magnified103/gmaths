services:
  postgres:
    image: postgres:17
    container_name: gmaths-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmaths_database
      POSTGRES_USER: gmaths_user
      POSTGRES_PASSWORD: gmaths_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmaths_user -d gmaths_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local 